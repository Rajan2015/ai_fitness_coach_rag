public_base_url: ""
log_level: INFO

twilio:
  validate_signature: true

redis:
  otp_ttl_seconds: 300
  otp_length: 6
  max_sends_per_window: 50
  send_window_seconds: 900
  max_verify_attempts: 500

database: {}  # url comes from DATABASE_URL env var (Neon Postgres connection string)

qdrant:
  nutrition_collection: "nutrition_facts"
  nutrition_model: "qdrant/bm25"
  final_candidates: 3

scoring:
  weights:
    calorie: 0.30
    protein: 0.25
    activity: 0.20
    water: 0.15
    consistency: 0.10
  calorie_tolerance_pct: 0.10
  protein_target_g_per_kg: 1.8
  steps_target: 10000
  water_target_ml: 2500
  consistency_window_days: 7
  worker_interval_seconds: 3600


llm:
  provider: openai        # openai | anthropic
  model: gpt-4o-mini
  default_model: gpt-4o-mini
  models:
    default: gpt-4o-mini
    confirm: gpt-4o-mini
  stt_translate_model: whisper-1   # OpenAI's translation endpoint only supports whisper-1 today


embeddings:
 provider: openai             
 model: text-embedding-3-small


chromadb:
 persist_dir: .chromadb/
 collection_name: codebase


memory:
 db_path: .fitness_coach/memory/memory.db
 summarize_at_tokens: 2000
 keep_last_messages: 10

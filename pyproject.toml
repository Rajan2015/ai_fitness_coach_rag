[project]
name = "ai-fitness-coach-rag"
version = "0.1.0"
description = ""
authors = [
    {name = "Rajan Garg",email = "rajan.garg+bold@bold.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0.0"
dependencies = [
 "python-dotenv (>=1.2.2,<2.0.0)",
    "openai (>=2.43.0,<3.0.0)",
    "chromadb (>=1.5.9,<2.0.0)",
    "rich (>=13.6.0,<16.0.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "langchain (>=1.3.11,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-openai (>=1.3.3,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-anthropic (>=1.4.7,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-huggingface (>=1.2.2,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "langchain-qdrant (>=1.1.0,<2.0.0) ; python_version >= \"3.12\" and python_full_version < \"4.0.0\"",
    "fastembed (>=0.8.0,<0.9.0)",
    "langgraph-checkpoint-sqlite (>=3.1.0,<4.0.0)",
    "tree-sitter (==0.21.3)",
    "tree-sitter-languages (==1.10.2)",
    "langchain-mcp-adapters (>=0.3.0,<0.4.0)",
    "watchdog (>=6.0.0,<7.0.0)",
    "redis (>=7.4.1,<8.0.0)",
    "redisvl (>=0.23.0,<0.24.0) ; python_version >= \"3.12\" and python_version < \"3.15\"",
    "twilio (>=9.11.2,<10.0.0)",
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "ngrok (>=1.7.0,<2.0.0)",
    "sqlalchemy (>=2.0.36,<3.0.0)",
    "qdrant-client (>=1.12.0,<2.0.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "tzdata (>=2026.5,<2027.0)"
]

[tool.poetry.scripts]
fitness_coach = "ai_fitness_coach_rag.main:run"


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]

[dependency-groups]
dev = [
    "deepeval (>=4.0.7,<5.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]
